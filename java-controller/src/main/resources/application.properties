spring.application.name=monitores-controller

server.port=8080
server.address=0.0.0.0

# URL del servicio PHP (PC2). Se pasa con la variable de entorno PHP_URL.
php.url=${PHP_URL:http://localhost:8000}

# Respuestas JSON en UTF-8 (tildes y eñes)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
